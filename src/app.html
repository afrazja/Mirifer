<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=mirifer-v3" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=mirifer-v3" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/brand/mirifer-icon-32.png?v=mirifer-v3" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/brand/mirifer-icon-16.png?v=mirifer-v3" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/mirifer-icon-180.png?v=mirifer-v3" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#0e5c45" />
		<!-- Apply the saved theme before first paint, otherwise the page
		     renders light and then snaps to dark. Key and attribute must
		     match src/lib/services/theme.ts. -->
		<script>
			(function () {
				try {
					var c = localStorage.getItem('mirifer_theme') || 'light';
					var landing = /^\/(?:fa\/?)?$/.test(window.location.pathname);
					var dark =
						!landing && (c === 'dark' ||
						(c === 'system' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches));
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', dark ? '#0f0f1a' : '#0e5c45');
					// Same reason as the theme: flipping lang/dir after paint
					// would visibly jump the layout from LTR to RTL.
					var fa = localStorage.getItem('mirifer_language') === 'fa';
					document.documentElement.setAttribute('lang', fa ? 'fa' : 'en');
					document.documentElement.setAttribute('dir', fa ? 'rtl' : 'ltr');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Mirifer" />
		<!-- No title element here on purpose. One in this file is emitted
		     ahead of the SvelteKit head placeholder below, so every page
		     shipped two and browsers and crawlers both take the first: every
		     per-page title was dead and the index read "Mirifer - Learn
		     German". The fallback lives in +layout.svelte now, inside
		     svelte:head, where a page replaces it instead of losing to it.

		     Never write a sveltekit percent-token in a comment here. The
		     placeholders are substituted by plain string replacement, with no
		     HTML parsing, so a token inside a comment injects the whole head
		     into it — and the injected SSR anchors close the comment early
		     and spill the rest onto the page as visible text. That shipped. -->
		<!-- Microsoft Clarity (proxied to bypass DNS blocks on clarity.ms) -->
		<script type="text/javascript">
			(function(c,l,a,r,i,t,y){
				if (location.pathname.startsWith("/admin") || ["localhost", "127.0.0.1"].includes(location.hostname)) return;
				c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
				t=l.createElement(r);t.async=1;t.src="/proxy/clarity/s/www/tag/"+i+"?v=2";
				y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
			})(window, document, "clarity", "script", "vgmxqi3z8w");
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
